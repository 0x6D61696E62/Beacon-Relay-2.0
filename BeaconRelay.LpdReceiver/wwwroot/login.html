<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon Relay Login</title>
  <link rel="stylesheet" href="admin/theme.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(85% 120% at -10% -20%, #c6d8ff 0%, transparent 58%),
        radial-gradient(90% 110% at 110% -10%, #caefe8 0%, transparent 48%),
        linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
      font-family: "Manrope", "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      padding: 18px;
    }

    .panel {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      display: block;
      height: 5px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
    }

    .panel-body {
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 1.2rem + 0.8vw, 1.9rem);
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    p {
      margin: 0 0 16px;
      color: var(--ink-soft);
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--ink-soft);
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      margin-top: 6px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    input:focus,
    button:focus-visible {
      outline: none;
      border-color: #79a8e8;
      box-shadow: 0 0 0 3px rgba(15, 92, 192, 0.16);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--ink-soft);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .remember input {
      width: auto;
      margin: 0;
    }

    button {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 700;
      transition: transform 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
      background: #0d4ea4;
    }

    .error {
      min-height: 1.2em;
      color: var(--error);
      margin-top: 12px;
      white-space: pre-wrap;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="panel-body">
      <h1>Beacon Relay Admin</h1>
      <p>Sign in to manage rules, destinations, and delivery operations.</p>
      <label>Username
        <input id="username" autocomplete="username" value="admin">
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password">
      </label>
      <label class="remember">
        <input id="rememberMe" type="checkbox"> Remember this browser
      </label>
      <button id="loginButton">Sign In</button>
      <div class="error" id="error"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get('returnUrl') || 'admin/index.html';
    const el = (id) => document.getElementById(id);

    async function submitLogin() {
      el('error').textContent = '';
      const response = await fetch('auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: el('username').value,
          password: el('password').value,
          rememberMe: el('rememberMe').checked
        })
      });

      if (!response.ok) {
        el('error').textContent = response.status === 401 ? 'Invalid username or password.' : 'Login failed.';
        return;
      }

      window.location.href = returnUrl;
    }

    el('loginButton').addEventListener('click', submitLogin);
    el('password').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        submitLogin();
      }
    });
  </script>
</body>
</html>
