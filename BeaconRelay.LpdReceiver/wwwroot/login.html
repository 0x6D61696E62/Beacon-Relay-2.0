<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon Relay Login</title>
  <style>
    :root {
      --bg: #f5ede2;
      --ink: #21170f;
      --panel: #fffaf3;
      --line: #d7c8b4;
      --accent: #9b4320;
      --error: #ab2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff7ec 0%, var(--bg) 60%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
    }
    .panel {
      width: min(420px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(26, 16, 10, 0.1);
      padding: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 16px; color: #675c50; }
    label { display: block; margin-bottom: 10px; font-size: 0.9rem; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .error {
      min-height: 1.2em;
      color: var(--error);
      margin-top: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Beacon Relay Admin</h1>
    <p>Sign in to manage rules, destinations, and delivery operations.</p>
    <label>Username
      <input id="username" autocomplete="username" value="admin">
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <label>
      <input id="rememberMe" type="checkbox" style="width:auto; margin-right:8px;"> Remember this browser
    </label>
    <button id="loginButton">Sign In</button>
    <div class="error" id="error"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get('returnUrl') || '/admin/index.html';
    const el = (id) => document.getElementById(id);

    async function submitLogin() {
      el('error').textContent = '';
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: el('username').value,
          password: el('password').value,
          rememberMe: el('rememberMe').checked
        })
      });

      if (!response.ok) {
        el('error').textContent = response.status === 401 ? 'Invalid username or password.' : 'Login failed.';
        return;
      }

      window.location.href = returnUrl;
    }

    el('loginButton').addEventListener('click', submitLogin);
    el('password').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        submitLogin();
      }
    });
  </script>
</body>
</html>
