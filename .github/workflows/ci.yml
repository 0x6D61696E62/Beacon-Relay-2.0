name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - copilot/**
      - feature/**
      - bugfix/**
    tags:
      - 'v*'

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute build metadata
        id: metadata
        shell: pwsh
        run: |
          $shortSha = "${env:GITHUB_SHA}".Substring(0, 8)
          $buildNumber = "${env:GITHUB_RUN_NUMBER}"
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_number=$buildNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: dotnet restore BeaconRelay.slnx

      - name: Build
        shell: pwsh
        run: |
          dotnet build BeaconRelay.slnx -c Release --no-restore `
            /p:BuildNumber=${{ steps.metadata.outputs.build_number }} `
            /p:SourceRevisionId=${{ steps.metadata.outputs.short_sha }}

      - name: Test
        shell: pwsh
        run: |
          dotnet test BeaconRelay.slnx -c Release --no-build `
            /p:BuildNumber=${{ steps.metadata.outputs.build_number }} `
            /p:SourceRevisionId=${{ steps.metadata.outputs.short_sha }}

      - name: Build deploy artifact and release notes
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $versionPrefix = ''
          if ("${env:GITHUB_REF_TYPE}" -eq 'tag' -and "${env:GITHUB_REF_NAME}" -match '^v[0-9]') {
            $versionPrefix = "${env:GITHUB_REF_NAME}".Substring(1)
          }
          else {
            [xml]$xml = Get-Content -LiteralPath .\Directory.Build.props -Raw
            $node = $xml.Project.PropertyGroup.VersionPrefix | Select-Object -First 1
            $versionPrefix = if ($node -is [System.Xml.XmlNode]) { $node.InnerText } else { [string]$node }
          }

          powershell -ExecutionPolicy Bypass -File .\deploy\Build-BeaconRelayArtifact.ps1 `
            -Configuration Release `
            -Runtime win-x64 `
            -SelfContained `
            -VersionPrefix $versionPrefix `
            -BuildNumber ${{ steps.metadata.outputs.build_number }} `
            -SourceRevisionId ${{ steps.metadata.outputs.short_sha }} `
            -GenerateReleaseNotes
